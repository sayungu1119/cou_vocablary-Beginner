<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日 10 個鄒語單字 - 學生版</title>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        #date-display {
            font-size: 1.2em;
            opacity: 0.9;
            margin-top: 10px;
        }
        #loading {
            color: white;
            font-size: 1.2em;
            margin-top: 20px;
        }
        #word-list {
            list-style: none;
            padding: 0;
            width: 90%;
            max-width: 1100px;
            margin-bottom: 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .word-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        .card-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .word {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
        }
        .meaning {
            font-size: 1.1em;
            color: #34495e;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .example-box {
            background-color: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 10px;
            font-size: 0.9em;
            border-radius: 0 8px 8px 0;
        }
        .sentence {
            color: #555;
            font-style: italic;
            display: block;
        }
        .translation {
            color: #777;
            margin-top: 5px;
            display: block;
        }
        @media (max-width: 900px) {
            #word-list { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            h1 { font-size: 2em; }
            header { margin-top: 30px; }
            #word-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🚀 每日鄒語閃卡</h1>
        <div id="date-display"></div>
    </header>

    <div id="loading">載入中，請稍候...</div>
    <ul id="word-list"></ul>

    <script>
        // ==================== 1. 設定你的 Supabase 資訊 ====================
        const SUPABASE_URL = 'https://lkhlrzjdrraficyxafuz.supabase.co'; // 已修正：移除結尾的 /rest/v1/
        const SUPABASE_ANON_KEY = 'sb_publishable_uK45FRTWY6LqRCtCW4j9XQ_fl_mH-AJ'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function getTodaySeed() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('date-display').innerText = `${year}年${month}月${day}日`;
            return parseInt(`${year}${month}${day}`, 10);
        }

        function seededRandom(seed) {
            let t = seed += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }

        function getDailyWords(allWords, count = 10) {
            const seed = getTodaySeed();
            let shuffled = [...allWords];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(seededRandom(seed + i) * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled.slice(0, count);
        }

        async function renderDailyWords() {
            const loadingEl = document.getElementById('loading');
            const ul = document.getElementById('word-list');

            try {
                const { data: allWords, error } = await supabaseClient
                    .from('vocabulary')
                    .select('*');

                if (error) throw error;

                if (!allWords || allWords.length === 0) {
                    loadingEl.innerText = '目前資料庫沒有單字，請先去新增！';
                    return;
                }

                loadingEl.style.display = 'none';
                const dailyWords = getDailyWords(allWords, 10);
                
                dailyWords.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'word-card';
                    li.innerHTML = `
                        <div>
                            <div class="card-header">
                                <span class="word">${index + 1}. ${item.word}</span>
                            </div>
                            <div class="meaning">${item.meaning}</div>
                        </div>
                        <div class="example-box">
                            <span class="sentence">${item.sentence}</span>
                            <span class="translation">${item.translation}</span>
                        </div>
                    `;
                    ul.appendChild(li);
                });

            } catch (err) {
                console.error("連線或抓取資料失敗：", err);
                loadingEl.innerText = `載入失敗：${err.message || '請檢查 Supabase 設定或網路連線。'}`;
            }
        }

        renderDailyWords();
    </script>
</body>
</html>
